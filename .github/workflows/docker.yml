name: Docker Scout Vehicle Bridge Diagnostic

on:
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:

  determine_docker_org_and_tag:
    runs-on: ubuntu-latest

    outputs:
      docker_organization: ${{ steps.docker-org-and-tag.outputs.docker_organization }}
      docker_image_tag: ${{ steps.docker-org-and-tag.outputs.docker_image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: docker-org-and-tag
        uses: usdot-fhwa-stol/actions/docker-org-and-tag@main

      - name: Show resolved Docker target
        run: |
          echo "=========================================="
          echo "PR head branch:"
          echo "${{ github.event.pull_request.head.ref }}"
          echo
          echo "PR base branch:"
          echo "${{ github.event.pull_request.base.ref }}"
          echo
          echo "Docker organization:"
          echo "${{ steps.docker-org-and-tag.outputs.docker_organization }}"
          echo
          echo "Docker baseline tag:"
          echo "${{ steps.docker-org-and-tag.outputs.docker_image_tag }}"
          echo "=========================================="

  vehicle-bridge-scout-diagnostic:
    needs: determine_docker_org_and_tag
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build vehicle bridge PR image
        uses: docker/build-push-action@v7
        with:
          context: ./telematic_system/telematic_units/carma_vehicle_bridge/
          file: ./telematic_system/telematic_units/carma_vehicle_bridge/Dockerfile
          load: true
          tags: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/carma_vehicle_nats_bridge:pr-${{ github.event.pull_request.number }}

      # Test exactly what we are currently using
      - name: Docker Scout Compare - current v1
        id: scout-current
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/carma_vehicle_nats_bridge:pr-${{ github.event.pull_request.number }}
          to: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/carma_vehicle_nats_bridge:${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}
          ignore-unchanged: true
          only-severities: critical,high
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: false

      # Diagnostic comparison using older Scout version
      - name: Docker Scout Compare - v1.12.0
        id: scout-112
        continue-on-error: true
        uses: docker/scout-action@v1.12.0
        with:
          command: compare
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/carma_vehicle_nats_bridge:pr-${{ github.event.pull_request.number }}
          to: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/carma_vehicle_nats_bridge:${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}
          ignore-unchanged: true
          only-severities: critical,high
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: false

      - name: Diagnostic summary
        if: always()
        run: |
          echo "======================================================"
          echo "DOCKER SCOUT VEHICLE BRIDGE DIAGNOSTIC RESULT"
          echo "======================================================"
          echo
          echo "PR HEAD:"
          echo "${{ github.event.pull_request.head.ref }}"
          echo
          echo "PR BASE:"
          echo "${{ github.event.pull_request.base.ref }}"
          echo
          echo "DOCKER ORGANIZATION:"
          echo "${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}"
          echo
          echo "BASELINE TAG:"
          echo "${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}"
          echo
          echo "CURRENT docker/scout-action@v1:"
          echo "${{ steps.scout-current.outcome }}"
          echo
          echo "docker/scout-action@v1.12.0:"
          echo "${{ steps.scout-112.outcome }}"
          echo
          echo "======================================================"
